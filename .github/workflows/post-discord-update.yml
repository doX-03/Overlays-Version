name: Sync OverTake update title

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-overtake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read latest OverTake update and update JSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const updatePageUrl = "https://www.overtake.gg/downloads/dox-lmu-overlays-collection.79667/updates";
          const jsonFile = "doX-LMU-Overlays-setup.json";

          const response = await fetch(updatePageUrl, {
            headers: {
              "User-Agent": "Mozilla/5.0 doX-LMU-Update-Sync"
            }
          });

          if (!response.ok) {
            throw new Error(`Failed to fetch OverTake page: ${response.status}`);
          }

          const html = await response.text();

          function decodeHtml(text) {
            return text
              .replace(/&amp;/g, "&")
              .replace(/&#039;/g, "'")
              .replace(/&#x27;/g, "'")
              .replace(/&quot;/g, '"')
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          // First attempt: find the update block by resource-update ID.
          let updateUrl = "";
          let fullTitle = "";

          const specificUpdateRegex = /id=["']resource-update-\d+["'][\s\S]{0,5000}?<h[1-3][^>]*>\s*<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>\s*<\/h[1-3]>/i;
          let match = html.match(specificUpdateRegex);

          // Fallback: first heading link on the updates page.
          if (!match) {
            const fallbackRegex = /<h[1-3][^>]*>\s*<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>\s*<\/h[1-3]>/i;
            match = html.match(fallbackRegex);
          }

          if (!match) {
            throw new Error("Could not find latest update title in OverTake HTML.");
          }

          updateUrl = match[1].replace(/&amp;/g, "&");
          fullTitle = decodeHtml(match[2].replace(/<[^>]*>/g, ""));

          if (!updateUrl.startsWith("http")) {
            updateUrl = `https://www.overtake.gg${updateUrl}`;
          }

          const versionMatch = fullTitle.match(/v?(\d+(?:\.\d+){1,3})/i);

          if (!versionMatch) {
            throw new Error(`Could not extract version from title: ${fullTitle}`);
          }

          const version = versionMatch[1];

          let updateTitle = fullTitle
            .replace(/^v?\d+(?:\.\d+){1,3}\s*[-–—:]?\s*/i, "")
            .trim();

          if (!updateTitle) {
            updateTitle = "Update";
          }

          let json = {};

          if (fs.existsSync(jsonFile)) {
            json = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
          }

          json.version = version;
          json.updateTitle = updateTitle;
          json.fullTitle = fullTitle;
          json.overtakeUrl = updateUrl;
          json.overtakeUpdatesUrl = updatePageUrl;
          json.publishDiscord = json.publishDiscord ?? true;

          fs.writeFileSync(jsonFile, JSON.stringify(json, null, 2) + "\n");

          console.log(`OverTake title found: ${fullTitle}`);
          console.log(`Version: ${version}`);
          console.log(`Update title: ${updateTitle}`);
          console.log(`URL: ${updateUrl}`);
          NODE

      - name: Commit JSON change
        run: |
          if git diff --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git config user.name "doX Update Bot"
          git config user.email "actions@github.com"

          git add doX-LMU-Overlays-setup.json
          git commit -m "Sync OverTake update title"
          git push
