name: Sync OverTake update and post to Discord

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post to Discord even if version did not change"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update-and-post:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read OverTake, update JSON and post Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          FORCE_POST: ${{ inputs.force_post }}
        run: |
          @'
          (async () => {
            const fs = require("fs");
            const { execSync } = require("child_process");

            const updatePageUrl = "https://www.overtake.gg/downloads/dox-lmu-overlays-collection.79667/updates";
            const resourcePathNeedle = "/downloads/dox-lmu-overlays-collection.79667/";
            const jsonFile = "doX-LMU-Overlays-setup.json";

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL || "";
            const forcePost = process.env.FORCE_POST === "true";

            const lappedCarRoleId = "1514766461468414122";

            function decodeHtml(text) {
              return String(text || "")
                .replace(/&amp;/g, "&")
                .replace(/&#039;/g, "'")
                .replace(/&#x27;/g, "'")
                .replace(/&quot;/g, '"')
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/&#(\d+);/g, (_, code) => {
                  const n = Number(code);
                  return Number.isFinite(n) ? String.fromCharCode(n) : "";
                })
                .replace(/&#x([0-9a-f]+);/gi, (_, code) => {
                  const n = parseInt(code, 16);
                  return Number.isFinite(n) ? String.fromCharCode(n) : "";
                })
                .replace(/\s+/g, " ")
                .trim();
            }

            function stripTags(html) {
              return decodeHtml(
                String(html || "")
                  .replace(/<script[\s\S]*?<\/script>/gi, " ")
                  .replace(/<style[\s\S]*?<\/style>/gi, " ")
                  .replace(/<[^>]*>/g, " ")
              );
            }

            function normalizeUrl(url) {
              url = decodeHtml(url || "");

              if (!url) return updatePageUrl;
              if (url.startsWith("http://") || url.startsWith("https://")) return url;
              if (url.startsWith("//")) return "https:" + url;
              if (url.startsWith("/")) return "https://www.overtake.gg" + url;

              return "https://www.overtake.gg/" + url;
            }

            async function fetchOvertakeHtml(url) {
              const response = await fetch(url, {
                method: "GET",
                redirect: "follow",
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,pt-BR;q=0.8,pt;q=0.7",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "Referer": "https://www.overtake.gg/",
                  "Upgrade-Insecure-Requests": "1"
                }
              });

              const body = await response.text();

              if (!response.ok) {
                const preview = body.replace(/\s+/g, " ").slice(0, 1000);
                throw new Error(`Failed to fetch OverTake page: ${response.status}. Response preview: ${preview}`);
              }

              return body;
            }

            function extractLatestUpdateFromHtml(html) {
              const headingRegex = /<h[1-4][^>]*>\s*<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>\s*<\/h[1-4]>/gi;

              for (const match of html.matchAll(headingRegex)) {
                const href = normalizeUrl(match[1]);
                const title = stripTags(match[2]);

                if (!href.includes(resourcePathNeedle)) continue;
                if (!title.match(/^v?\d+(?:\.\d+){1,3}\b/i)) continue;

                return { url: href, title };
              }

              const anchorRegex = /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

              for (const match of html.matchAll(anchorRegex)) {
                const href = normalizeUrl(match[1]);
                const title = stripTags(match[2]);

                if (!href.includes(resourcePathNeedle)) continue;
                if (!title.match(/^v?\d+(?:\.\d+){1,3}\b/i)) continue;

                return { url: href, title };
              }

              throw new Error("Could not find the latest OverTake update title/link.");
            }

            const oldJson = fs.existsSync(jsonFile)
              ? JSON.parse(fs.readFileSync(jsonFile, "utf8"))
              : {};

            const html = await fetchOvertakeHtml(updatePageUrl);
            const latestUpdate = extractLatestUpdateFromHtml(html);

            const latestUpdateUrl = latestUpdate.url;
            const fullTitle = latestUpdate.title;

            const versionMatch = fullTitle.match(/^v?(\d+(?:\.\d+){1,3})\b/i);

            if (!versionMatch) {
              throw new Error(`Could not extract version from title: ${fullTitle}`);
            }

            const version = versionMatch[1];

            let updateTitle = fullTitle
              .replace(/^v?\d+(?:\.\d+){1,3}\s*[-–—:]?\s*/i, "")
              .trim();

            if (!updateTitle) {
              updateTitle = "Update";
            }

            const oldVersion = oldJson.version || "";
            const versionChanged = oldVersion !== version;

            const newJson = {
              ...oldJson,
              version,
              downloadUrl: oldJson.downloadUrl || updatePageUrl,
              updateTitle,
              fullTitle,
              overtakeUrl: latestUpdateUrl,
              overtakeUpdatesUrl: updatePageUrl,
              publishDiscord: oldJson.publishDiscord ?? true
            };

            const oldSerialized = JSON.stringify(oldJson, null, 2) + "\n";
            const newSerialized = JSON.stringify(newJson, null, 2) + "\n";
            const jsonChanged = oldSerialized !== newSerialized;

            fs.writeFileSync(jsonFile, newSerialized);

            console.log(`Old version: ${oldVersion || "(none)"}`);
            console.log(`Latest OverTake version: ${version}`);
            console.log(`Latest OverTake title: ${fullTitle}`);
            console.log(`Latest OverTake URL: ${latestUpdateUrl}`);
            console.log(`Version changed: ${versionChanged}`);
            console.log(`JSON changed: ${jsonChanged}`);
            console.log(`Force post: ${forcePost}`);

            if (jsonChanged) {
              execSync('git config user.name "doX Update Bot"');
              execSync('git config user.email "actions@github.com"');
              execSync(`git add ${jsonFile}`);
              execSync(`git commit -m "Update OverTake version data"`);
              execSync("git push");
            } else {
              console.log("JSON already up to date. No commit needed.");
            }

            if (newJson.publishDiscord === false) {
              console.log("publishDiscord is false. Skipping Discord post.");
              return;
            }

            if (!versionChanged && !forcePost) {
              console.log("Version did not change and force_post is false. Skipping Discord post.");
              return;
            }

            if (!webhookUrl) {
              console.log("DISCORD_UPDATES_WEBHOOK secret is missing. JSON sync completed, but Discord post was skipped.");
              return;
            }

            const hasRoleMention =
              lappedCarRoleId &&
              lappedCarRoleId !== "COLE_AQUI_O_ID_DO_CARGO_LAPPED_CAR";

            const discordPayload = {
              username: "doX Updates",
              content: hasRoleMention ? `<@&${lappedCarRoleId}>` : "",
              allowed_mentions: hasRoleMention
                ? { roles: [lappedCarRoleId] }
                : { parse: [] },
              embeds: [
                {
                  title: fullTitle,
                  url: latestUpdateUrl,
                  description: "A new version of doX LMU Overlays Collection is available.",
                  fields: [
                    {
                      name: "Version",
                      value: version,
                      inline: true
                    },
                    {
                      name: "Update title",
                      value: updateTitle,
                      inline: false
                    },
                    {
                      name: "Download",
                      value: updatePageUrl,
                      inline: false
                    }
                  ],
                  footer: {
                    text: "doX LMU Overlays Collection"
                  }
                }
              ]
            };

            const discordResponse = await fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(discordPayload)
            });

            if (!discordResponse.ok) {
              const body = await discordResponse.text();
              throw new Error(`Discord webhook failed: ${discordResponse.status} ${body}`);
            }

            console.log(
              hasRoleMention
                ? `Discord post sent with role mention for version ${version}.`
                : `Discord post sent without role mention for version ${version}.`
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          '@ | Set-Content -Path sync-overtake-discord.js -Encoding UTF8

          node sync-overtake-discord.js
